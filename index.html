<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Žulidlo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Abril+Fatface&family=Alegreya:wght@500;700&family=Baskervville&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #3D2A5C;
    --bg-2: #1B1129;
    --paper: #FAF7FC;
    --paper-deep: #E2D4F0;
    --ink: #2A2138;
    --ink-soft: #7B7089;
    --accent: #7C4DA6;
    --accent-deep: #5C3980;
    --danger: #A34A72;
    --radius: 16px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --hand: 'Caveat', cursive;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(ellipse at 50% 15%, var(--bg-1) 0%, var(--bg-2) 78%);
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
  }

  body.locked { align-items: center; overflow: hidden; }

  .hidden { display: none !important; }

  #loading { color: #d9cce9; font-size: 0.9rem; letter-spacing: 0.02em; }

  #lock-screen {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: 0 30px 70px rgba(0,0,0,0.45), 0 6px 20px rgba(0,0,0,0.3);
    padding: 52px 40px 44px;
    max-width: 340px;
    width: 100%;
    min-width: 0;
    text-align: center;
    animation: rise 0.5s ease both;
  }

  input[type="password"], input[type="text"], textarea {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid var(--paper-deep);
    border-radius: 10px;
    font-size: 1rem;
    background: #FDFBFE;
    color: var(--ink);
    font-family: var(--sans);
    overflow-wrap: break-word;
  }

  textarea {
    line-height: 1.6;
    resize: vertical;
    min-height: 160px;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,77,166,0.16);
  }

  button {
    font-family: var(--sans);
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    padding: 13px 22px;
    transition: transform 0.1s ease, opacity 0.15s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:focus:not(:focus-visible) { outline: none; }

  .btn-primary { background: var(--accent); color: #FFFFFF; width: 100%; margin-top: 16px; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-deep); }
  .btn-inline { width: auto; margin-top: 0; }

  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--paper-deep) !important;
    padding: 7px 15px;
    font-size: 0.8rem;
  }
  .btn-ghost:hover { border-color: var(--accent) !important; color: var(--accent-deep); }

  #error-msg { color: var(--danger); font-size: 0.85rem; margin: 16px 0 0; }

  #main-wrap { width: 100%; max-width: 1080px; min-width: 0; animation: rise 0.5s ease both; }

  #page {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: 0 30px 70px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.25);
    padding: 40px 32px;
    display: grid;
    grid-template-columns: minmax(100px, 1fr) minmax(280px, 600px) minmax(100px, 1fr);
    grid-template-areas:
      "top top top"
      "left center right";
    column-gap: 26px;
    row-gap: 10px;
    align-items: start;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .topbar {
    grid-area: top;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .pill {
    font-size: 0.72rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent-deep);
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  #text-column { grid-area: center; min-width: 0; }

  #card-tabs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    min-width: 0;
  }
  .card-tab-wrap { position: relative; display: inline-flex; max-width: 100%; min-width: 0; }
  .card-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--paper-deep);
    background: #FDFBFE;
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-tab:hover { border-color: var(--accent); color: var(--accent-deep); }
  .card-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .card-tab-add {
    border-style: dashed;
    color: var(--ink-soft);
    background: transparent;
    font-size: 0.82rem;
    padding: 7px 14px;
    white-space: nowrap;
  }
  .card-tab-add:hover { border-color: var(--accent); color: var(--accent-deep); }
  .card-tab-delete {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  #site-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 2.3rem;
    line-height: 1.2;
    margin: 0 0 20px;
    margin-left: -10px;
    padding: 4px 10px;
    border: 1px solid transparent;
    background: transparent;
    width: calc(100% + 20px);
    color: var(--ink);
    border-radius: 8px;
    overflow-wrap: break-word;
  }
  #site-title:focus { background: #FDFBFE; }
  #site-title[readonly] { cursor: default; }
  #site-title[readonly]:focus { border-color: transparent; box-shadow: none; background: transparent; }

  #site-text {
    font-size: 1.04rem;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
    margin-bottom: 8px;
  }

  #empty-note { color: var(--ink-soft); font-style: italic; font-size: 0.95rem; }

  .photo-bar {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding-top: 6px;
  }
  #photo-bar-left { grid-area: left; }
  #photo-bar-right { grid-area: right; }

  .polaroid {
    --rot: 0deg;
    --shift: 0px;
    width: 112px;
    background: #fff;
    padding: 8px 8px 4px;
    box-shadow: 0 14px 26px rgba(20,10,30,0.35), 0 3px 8px rgba(20,10,30,0.2);
    position: relative;
    display: flex;
    flex-direction: column;
    transform: rotate(var(--rot)) translateX(var(--shift));
    transition: transform 0.2s ease;
  }
  .polaroid.big { width: 136px; }
  .polaroid:hover {
    --rot: 0deg;
    --shift: 0px;
    transform: rotate(var(--rot)) translateX(var(--shift)) scale(1.07);
    z-index: 5;
  }

  .polaroid .photo-inner { width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--paper-deep); flex-shrink: 0; }
  .polaroid img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }

  .polaroid-caption {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 30px;
    padding: 3px 3px 5px;
    font-family: var(--hand);
    font-size: 1.2rem;
    line-height: 1.1;
    text-align: center;
    color: var(--ink);
    outline: none;
    overflow-wrap: break-word;
    word-break: break-word;
    cursor: default;
  }
  .polaroid-caption[contenteditable="true"] { cursor: text; }
  .polaroid-caption:empty::before {
    content: attr(data-placeholder);
    color: var(--ink-soft);
    opacity: 0.55;
    font-family: var(--sans);
    font-size: 0.7rem;
  }

  .photo-delete {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--danger);
    color: white;
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    transform: rotate(calc(-1 * var(--rot)));
    z-index: 2;
  }

  #lightbox {
    position: fixed; inset: 0;
    background: rgba(12,7,18,0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 30px; cursor: zoom-out;
  }
  .lightbox-polaroid {
    background: #fff;
    padding: 16px 16px 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    max-width: min(90vw, 640px);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    cursor: default;
  }
  .lightbox-photo-inner {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .lightbox-photo-inner img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .lightbox-caption {
    font-family: var(--hand);
    font-size: 1.7rem;
    line-height: 1.2;
    text-align: center;
    color: var(--ink);
    padding: 10px 6px 4px;
    min-height: 2rem;
  }

  #admin-controls { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--paper-deep); }
  #save-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #save-status, #pw-status { font-size: 0.85rem; color: var(--ink-soft); }
  .pw-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .pw-row input { flex: 1; min-width: 170px; }
  details { margin-top: 22px; font-size: 0.9rem; }
  details summary { cursor: pointer; color: var(--ink-soft); font-weight: 600; }
  details summary:hover { color: var(--accent-deep); }
  #token-status { font-size: 0.8rem; margin-top: 6px; color: var(--ink-soft); }

  .appearance-label { margin: 14px 0 0; font-size: 0.78rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  .theme-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .theme-swatch {
    width: 34px; height: 34px; border-radius: 50%;
    border: none; padding: 0; cursor: pointer;
    color: #fff; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .theme-swatch.active { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink), 0 2px 6px rgba(0,0,0,0.25); }

  .font-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .font-swatch {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--paper-deep);
    background: #FDFBFE;
    color: var(--ink);
    font-size: 1.05rem;
    cursor: pointer;
  }
  .font-swatch.active { border-color: var(--accent); background: var(--accent); color: #fff; }

  @media (max-width: 860px) {
    body:not(.locked) { padding: 16px; }
    #page {
      grid-template-columns: 1fr;
      grid-template-areas: "top" "center" "left" "right";
      padding: 30px 20px;
    }
    .photo-bar { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 18px; padding-top: 0; }
    #site-title { font-size: 1.9rem; }
  }

  @media (max-width: 480px) {
    body:not(.locked) { padding: 10px; }
    #lock-screen { padding: 40px 22px 32px; max-width: 100%; }
    #page { padding: 24px 16px; }
    #site-title { font-size: 1.55rem; margin-left: -6px; width: calc(100% + 12px); padding: 4px 6px; }
    #site-text, textarea#edit-text { font-size: 1rem; }
    .photo-bar { gap: 14px; }
    .polaroid { width: 96px; padding: 7px 7px 3px; }
    .polaroid.big { width: 118px; }
    .polaroid-caption { font-size: 1.05rem; min-height: 26px; }
    .photo-delete { width: 28px; height: 28px; font-size: 16px; top: -9px; right: -9px; }
    #lightbox { padding: 16px; }
    .lightbox-caption { font-size: 1.4rem; }
    #save-row { flex-direction: column; align-items: stretch; gap: 10px; }
    .btn-inline { width: 100%; }
    .pw-row { flex-direction: column; }
    .pw-row input { min-width: 0; width: 100%; }
    .card-tab { max-width: 110px; padding: 6px 13px; font-size: 0.78rem; }
    .card-tab-add { padding: 6px 12px; font-size: 0.78rem; }
    .card-tab-delete { width: 18px; height: 18px; font-size: 11px; top: -6px; right: -6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
<script>
  // Applies the last-saved colours/font from this browser's cache before
  // anything paints, so repeat visits never flash the default purple while
  // content.json is still loading. The real fetch (below, in the main
  // script) re-applies and refreshes this cache once it resolves.
  (function() {
    try {
      var cached = localStorage.getItem('zulidlo_appearance');
      if (cached) {
        var vars = JSON.parse(cached);
        var style = document.documentElement.style;
        Object.keys(vars).forEach(function(k) {
          if (vars[k]) style.setProperty(k, vars[k]);
        });
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="locked">

<div id="loading">Načítám…</div>
<div id="lock-screen" class="hidden">
  <input type="password" id="password-input" placeholder="Heslo" autocomplete="current-password">
  <button class="btn-primary" id="unlock-btn">Vstoupit</button>
  <p id="error-msg" class="hidden"></p>
</div>

<div id="main-wrap" class="hidden">
  <div id="page">
    <div class="topbar">
      <span id="role-badge" class="pill hidden">Správce</span>
      <button class="btn-ghost" id="logout-btn">Odhlásit</button>
    </div>

    <div class="photo-bar" id="photo-bar-left"></div>

    <div id="text-column">
      <div id="card-tabs"></div>
      <input id="site-title" type="text" readonly>
      <div id="site-text"></div>
      <textarea id="edit-text" class="hidden" placeholder="Sem napište text stránky…"></textarea>
      <p id="empty-note" class="hidden">Zatím tu nic není.</p>

      <div id="admin-controls" class="hidden">
        <input type="file" id="photo-upload" accept="image/*" multiple class="hidden">
        <div id="save-row">
          <button class="btn-primary btn-inline" id="save-btn">Uložit změny</button>
          <button class="btn-ghost" id="add-photo-btn">Přidat fotky</button>
          <span id="save-status"></span>
        </div>

        <details>
          <summary>Vzhled stránky</summary>
          <p class="appearance-label">Barva</p>
          <div class="theme-row" id="theme-row"></div>
          <p class="appearance-label">Font nadpisu</p>
          <div class="font-row" id="font-row"></div>
        </details>

        <details>
          <summary>Změnit hesla</summary>
          <div class="pw-row">
            <input type="password" id="new-admin-pass" placeholder="Nové heslo správce" autocomplete="new-password">
            <input type="password" id="new-view-pass" placeholder="Nové heslo pro prohlížení" autocomplete="new-password">
          </div>
          <div class="pw-row">
            <button class="btn-ghost" id="update-pw-btn">Uložit nová hesla</button>
            <span id="pw-status"></span>
          </div>
        </details>

        <details id="token-config">
          <summary>Nastavit GitHub token (nutné pro ukládání)</summary>
          <div class="pw-row">
            <input type="password" id="github-token" placeholder="Vlož svůj GitHub token" autocomplete="off">
            <button class="btn-ghost" id="save-token-btn">Uložit token</button>
          </div>
          <p id="token-status"></p>
        </details>
      </div>
    </div>

    <div class="photo-bar" id="photo-bar-right"></div>
  </div>
</div>

<div id="lightbox" class="hidden">
  <div class="lightbox-polaroid">
    <div class="lightbox-photo-inner"><img id="lightbox-img" src="" alt=""></div>
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
</div>

<script>
(function() {
  const SALT = 'ministranka-salt-9f2';
  const MAX_DIM = 1600;
  const JPEG_QUALITY = 0.8;
  const REPO = 'lunarfrost5/kld';
  const BRANCH = 'main';

  let state = {
    role: null,
    passwords: null,
    content: { theme: 'purple', font: 'fraunces', cards: [] },
    activeCardId: null,
    githubToken: null
  };

  let contentPromise = null;
  let passwordsPromise = null;

  const $ = (id) => document.getElementById(id);

  async function sha256(text) {
    const enc = new TextEncoder().encode(text + SALT);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function noCacheUrl(path) { return path + '?t=' + Date.now(); }

  function genId() { return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function makeCard(name) {
    const n = (name || '').trim() || 'Nová karta';
    return { id: genId(), name: n, title: n, text: '', photos: [] };
  }

  function normalizePhotos(photos) {
    if (!Array.isArray(photos)) return [];
    return photos.map(item => {
      if (typeof item === 'string') return { url: item, caption: '' };
      if (item && typeof item === 'object' && item.url) return { url: item.url, caption: item.caption || '' };
      if (item && item.photo) return { url: item.photo, caption: '' };
      return null;
    }).filter(Boolean);
  }

  function defaultContent() {
    return { theme: 'purple', font: 'fraunces', cards: [{ id: genId(), name: 'Hlavní', title: 'Vítejte', text: '', photos: [] }] };
  }

  function migrateContent(data) {
    if (data && Array.isArray(data.cards) && data.cards.length > 0) {
      data.cards.forEach(c => {
        if (!c.id) c.id = genId();
        if (typeof c.name !== 'string' || !c.name) c.name = 'Karta';
        if (typeof c.title !== 'string') c.title = '';
        if (typeof c.text !== 'string') c.text = '';
        c.photos = normalizePhotos(c.photos);
      });
      return { theme: data.theme || 'purple', font: data.font || 'fraunces', cards: data.cards };
    }
    const existingTitle = (data && typeof data.title === 'string' && data.title.trim()) ? data.title.trim() : '';
    const card = {
      id: genId(),
      name: existingTitle || 'Hlavní',
      title: (data && data.title) || '',
      text: (data && data.text) || '',
      photos: normalizePhotos(data && data.photos)
    };
    return { theme: (data && data.theme) || 'purple', font: (data && data.font) || 'fraunces', cards: [card] };
  }

  async function loadPasswords() {
    try {
      const res = await fetch(noCacheUrl('passwords.json'), { cache: 'no-store' });
      if (!res.ok) throw new Error('Nelze načíst hesla');
      state.passwords = await res.json();
    } catch (e) {
      console.error('Chyba načítání hesel:', e);
      state.passwords = {};
    }
  }

  async function loadContent() {
    try {
      const res = await fetch(noCacheUrl('content.json'), { cache: 'no-store' });
      if (!res.ok) throw new Error('Nelze načíst obsah');
      const data = await res.json();
      state.content = migrateContent(data);
    } catch (e) {
      console.error('Chyba načítání obsahu:', e);
      state.content = defaultContent();
    }
  }

  function getActiveCard() {
    return state.content.cards.find(c => c.id === state.activeCardId) || state.content.cards[0];
  }

  function getToken() { return localStorage.getItem('github_token'); }

  function saveToken(token) {
    localStorage.setItem('github_token', token);
    state.githubToken = token;
    $('token-status').textContent = 'Token uložen.';
    $('token-status').style.color = 'var(--ink-soft)';
  }

  async function saveToGitHub(path, content, message) {
    const token = state.githubToken || getToken();
    if (!token) throw new Error('Chybí GitHub token. Nastav ho v administraci.');

    const apiUrl = `https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`;
    let sha = null;
    try {
      const getRes = await fetch(apiUrl, { headers: { Authorization: `token ${token}` } });
      if (getRes.ok) {
        const fileData = await getRes.json();
        sha = fileData.sha;
      } else if (getRes.status !== 404) {
        throw new Error(`GitHub API chyba: ${getRes.status}`);
      }
    } catch (e) {
      throw new Error(`Nelze ověřit existující soubor (repo: ${REPO}, cesta: ${path}): ` + e.message);
    }

    const body = { message: message, content: btoa(unescape(encodeURIComponent(content))), branch: BRANCH };
    if (sha) body.sha = sha;

    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      throw new Error(`${err.message || 'Chyba při ukládání'} (repo: ${REPO}, cesta: ${path}, status: ${putRes.status})`);
    }
  }

  function openLightbox(url, caption) {
    $('lightbox-img').src = url;
    $('lightbox-caption').textContent = caption || '';
    $('lightbox').classList.remove('hidden');
  }
  $('lightbox').addEventListener('click', (e) => {
    if (e.target === $('lightbox')) $('lightbox').classList.add('hidden');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('lightbox').classList.add('hidden');
  });

  function hashStr(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    }
    return Math.abs(h);
  }

  function photoStyle(url) {
    const rotHash = hashStr(url + 'r');
    const sign = (rotHash % 2 === 0) ? 1 : -1;
    const magnitude = 2 + ((rotHash % 1000) / 1000) * 5;
    const rot = sign * magnitude;
    const shift = (window.innerWidth <= 860) ? 0 : ((hashStr(url + 's') % 1000) / 1000) * 22 - 11;
    const big = (hashStr(url + 'z') % 2) === 0;
    return { rot, shift, big };
  }

  const THEMES = {
    purple:     { label: 'Fialová',        bg1: '#3D2A5C', bg2: '#1B1129', paper: '#FAF7FC', paperDeep: '#E2D4F0', ink: '#2A2138', inkSoft: '#7B7089', accent: '#7C4DA6', accentDeep: '#5C3980', danger: '#A34A72' },
    emerald:    { label: 'Smaragdová',     bg1: '#1F4A3D', bg2: '#0E2620', paper: '#F6F8F3', paperDeep: '#DCE8D8', ink: '#1E2B24', inkSoft: '#6E7C71', accent: '#2F8F63', accentDeep: '#226B49', danger: '#B25444' },
    midnight:   { label: 'Půlnoční modrá', bg1: '#223A5E', bg2: '#0F1B2E', paper: '#F5F7FA', paperDeep: '#D9E2EC', ink: '#1E2733', inkSoft: '#6B7686', accent: '#3B6EA5', accentDeep: '#2C517D', danger: '#B25757' },
    terracotta: { label: 'Terakota',       bg1: '#5C3A2A', bg2: '#2B1810', paper: '#FBF3E9', paperDeep: '#EAD9C2', ink: '#3A2A1E', inkSoft: '#8A7259', accent: '#B4623E', accentDeep: '#8F4B2E', danger: '#A3454A' },
    rose:       { label: 'Růžová',         bg1: '#5C2A44', bg2: '#2B0F1F', paper: '#FDF5F7', paperDeep: '#EFD7E0', ink: '#3A1E2A', inkSoft: '#8A6E78', accent: '#B14A72', accentDeep: '#8C3759', danger: '#A34A4A' }
  };

  const FONTS = {
    fraunces:   { label: 'Fraunces',      family: "'Fraunces', Georgia, serif" },
    abril:      { label: 'Abril Fatface', family: "'Abril Fatface', Georgia, serif" },
    alegreya:   { label: 'Alegreya',      family: "'Alegreya', Georgia, serif" },
    baskerville:{ label: 'Baskervville',  family: "'Baskervville', Georgia, serif" }
  };

  // Snapshots whatever is currently applied to :root so the next page load
  // can repaint instantly from cache instead of flashing the default theme
  // while content.json is still being fetched.
  function cacheAppearance() {
    try {
      const vars = ['--bg-1','--bg-2','--paper','--paper-deep','--ink','--ink-soft','--accent','--accent-deep','--danger','--serif'];
      const style = document.documentElement.style;
      const snapshot = {};
      vars.forEach(v => { snapshot[v] = style.getPropertyValue(v); });
      localStorage.setItem('zulidlo_appearance', JSON.stringify(snapshot));
    } catch (e) {}
  }

  function applyTheme(key) {
    const t = THEMES[key] || THEMES.purple;
    const root = document.documentElement.style;
    root.setProperty('--bg-1', t.bg1);
    root.setProperty('--bg-2', t.bg2);
    root.setProperty('--paper', t.paper);
    root.setProperty('--paper-deep', t.paperDeep);
    root.setProperty('--ink', t.ink);
    root.setProperty('--ink-soft', t.inkSoft);
    root.setProperty('--accent', t.accent);
    root.setProperty('--accent-deep', t.accentDeep);
    root.setProperty('--danger', t.danger);
    cacheAppearance();
  }

  function applyFont(key) {
    const f = FONTS[key] || FONTS.fraunces;
    document.documentElement.style.setProperty('--serif', f.family);
    cacheAppearance();
  }

  function renderThemeSwatches() {
    const row = $('theme-row');
    if (!row) return;
    row.innerHTML = '';
    const active = state.content.theme || 'purple';
    Object.keys(THEMES).forEach((key) => {
      const t = THEMES[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'theme-swatch' + (key === active ? ' active' : '');
      btn.style.background = t.accent;
      btn.title = t.label;
      btn.setAttribute('aria-label', t.label);
      btn.textContent = key === active ? '✓' : '';
      btn.addEventListener('click', () => {
        state.content.theme = key;
        applyTheme(key);
        renderThemeSwatches();
      });
      row.appendChild(btn);
    });
  }

  function renderFontSwatches() {
    const row = $('font-row');
    if (!row) return;
    row.innerHTML = '';
    const active = state.content.font || 'fraunces';
    Object.keys(FONTS).forEach((key) => {
      const f = FONTS[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'font-swatch' + (key === active ? ' active' : '');
      btn.style.fontFamily = f.family;
      btn.textContent = f.label;
      btn.addEventListener('click', () => {
        state.content.font = key;
        applyFont(key);
        renderFontSwatches();
      });
      row.appendChild(btn);
    });
  }

  // ---- Archive / cards ----

  function switchCard(id) {
    if (id === state.activeCardId) return;
    if (state.role === 'admin') {
      const current = getActiveCard();
      if (current) {
        current.title = $('site-title').value;
        current.text = $('edit-text').value;
      }
    }
    state.activeCardId = id;
    renderContent();
  }

  function addCard() {
    const name = prompt('Název nové karty:', 'Nová karta');
    if (name === null) return;
    const card = makeCard(name);
    state.content.cards.push(card);
    state.activeCardId = card.id;
    renderContent();
  }

  function renameCard(id) {
    const card = state.content.cards.find(c => c.id === id);
    if (!card) return;
    const name = prompt('Nový název karty:', card.name);
    if (name === null) return;
    card.name = name.trim() || card.name;
    renderCardTabs();
  }

  function deleteCard(id) {
    if (state.content.cards.length <= 1) { alert('Poslední kartu nelze smazat.'); return; }
    const card = state.content.cards.find(c => c.id === id);
    if (!card) return;
    if (!confirm(`Opravdu smazat kartu „${card.name}“ i s jejím textem a fotkami (po uložení)?`)) return;
    state.content.cards = state.content.cards.filter(c => c.id !== id);
    if (state.activeCardId === id) state.activeCardId = state.content.cards[0].id;
    renderContent();
  }

  function renderCardTabs() {
    const bar = $('card-tabs');
    if (!bar) return;
    const cards = state.content.cards;
    const showBar = state.role === 'admin' || cards.length > 1;
    bar.classList.toggle('hidden', !showBar);
    if (!showBar) return;

    bar.innerHTML = '';
    cards.forEach(card => {
      const wrap = document.createElement('div');
      wrap.className = 'card-tab-wrap';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card-tab' + (card.id === state.activeCardId ? ' active' : '');
      btn.textContent = card.name || 'Karta';
      btn.title = card.name || 'Karta';
      btn.setAttribute('aria-pressed', card.id === state.activeCardId ? 'true' : 'false');
      btn.addEventListener('click', () => switchCard(card.id));
      if (state.role === 'admin') {
        btn.title = (card.name || 'Karta') + ' — dvojklik přejmenuje';
        btn.addEventListener('dblclick', () => renameCard(card.id));
      }
      wrap.appendChild(btn);

      if (state.role === 'admin' && cards.length > 1) {
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'card-tab-delete';
        delBtn.innerHTML = '&times;';
        delBtn.title = 'Smazat kartu';
        delBtn.setAttribute('aria-label', 'Smazat kartu');
        delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteCard(card.id); });
        wrap.appendChild(delBtn);
      }
      bar.appendChild(wrap);
    });

    if (state.role === 'admin') {
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'card-tab-add';
      addBtn.textContent = '+ Přidat';
      addBtn.title = 'Přidat kartu';
      addBtn.addEventListener('click', addCard);
      bar.appendChild(addBtn);
    }
  }

  // ---- Photos ----

  function deletePhoto(index) {
    if (confirm('Opravdu smazat tuto fotku?')) {
      getActiveCard().photos.splice(index, 1);
      renderPhotos();
    }
  }

  function renderPhotos() {
    const leftBar = $('photo-bar-left');
    const rightBar = $('photo-bar-right');
    leftBar.innerHTML = '';
    rightBar.innerHTML = '';
    const card = getActiveCard();

    card.photos.forEach((photo, index) => {
      if (!photo || !photo.url) return;
      const style = photoStyle(photo.url);
      const item = document.createElement('div');
      item.className = 'polaroid' + (style.big ? ' big' : '');
      item.style.setProperty('--rot', style.rot.toFixed(2) + 'deg');
      item.style.setProperty('--shift', style.shift.toFixed(1) + 'px');

      const inner = document.createElement('div');
      inner.className = 'photo-inner';
      const img = document.createElement('img');
      img.src = photo.url;
      img.alt = photo.caption || 'fotka';
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(photo.url, photo.caption));
      inner.appendChild(img);
      item.appendChild(inner);

      const caption = document.createElement('div');
      caption.className = 'polaroid-caption';
      caption.textContent = photo.caption || '';
      if (state.role === 'admin') {
        caption.contentEditable = 'true';
        caption.setAttribute('data-placeholder', 'popisek…');
        caption.addEventListener('blur', () => { photo.caption = caption.textContent.trim(); });
        caption.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); caption.blur(); }
        });
      }
      item.appendChild(caption);

      if (state.role === 'admin') {
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'photo-delete';
        delBtn.innerHTML = '&times;';
        delBtn.title = 'Smazat fotku';
        delBtn.setAttribute('aria-label', 'Smazat fotku');
        delBtn.addEventListener('click', (e) => { e.stopPropagation(); deletePhoto(index); });
        item.appendChild(delBtn);
      }

      (index % 2 === 0 ? leftBar : rightBar).appendChild(item);
    });

    const noPhotos = card.photos.length === 0;
    const noText = !card.text || !card.text.trim();
    $('empty-note').classList.toggle('hidden', !(noPhotos && noText));
  }

  function renderContent() {
    const card = getActiveCard();
    $('site-title').value = card.title || '';
    $('site-text').textContent = card.text || '';
    $('edit-text').value = card.text || '';
    renderPhotos();
    renderCardTabs();
  }

  async function resizeAndCompress(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let { width, height } = img;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) { height = Math.round(height * MAX_DIM / width); width = MAX_DIM; }
          else { width = Math.round(width * MAX_DIM / height); height = MAX_DIM; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('Obrázek se nepodařilo načíst – zkontrolujte, zda je soubor platný.'));
      };
      img.src = url;
    });
  }

  async function saveContent() {
    const status = $('save-status');
    const btn = $('save-btn');
    const card = getActiveCard();
    card.title = $('site-title').value;
    card.text = $('edit-text').value;

    const json = JSON.stringify(state.content, null, 2);
    btn.disabled = true;
    status.textContent = 'Ukládám…';
    status.style.color = 'var(--ink-soft)';

    try {
      await saveToGitHub('content.json', json, 'Aktualizace obsahu');
      status.textContent = 'Uloženo ✓';
    } catch (err) {
      status.textContent = 'Chyba: ' + err.message;
      status.style.color = 'var(--danger)';
    } finally {
      btn.disabled = false;
      setTimeout(() => { status.textContent = ''; }, 4000);
    }
  }

  async function savePasswords() {
    const newAdmin = $('new-admin-pass').value;
    const newView = $('new-view-pass').value;
    const status = $('pw-status');
    if (!newAdmin && !newView) {
      status.textContent = 'Vyplňte alespoň jedno heslo.';
      status.style.color = 'var(--danger)';
      return;
    }
    const passwords = {
      adminHash: newAdmin ? await sha256(newAdmin) : state.passwords.adminHash,
      viewHash: newView ? await sha256(newView) : state.passwords.viewHash
    };
    const json = JSON.stringify(passwords, null, 2);
    try {
      await saveToGitHub('passwords.json', json, 'Aktualizace hesel');
      state.passwords = passwords;
      status.textContent = 'Hesla uložena ✓';
      status.style.color = 'var(--ink-soft)';
      $('new-admin-pass').value = '';
      $('new-view-pass').value = '';
    } catch (err) {
      status.textContent = 'Chyba: ' + err.message;
      status.style.color = 'var(--danger)';
    }
    setTimeout(() => { status.textContent = ''; }, 4000);
  }

  async function uploadPhoto(file) {
    const token = state.githubToken || getToken();
    if (!token) throw new Error('Chybí GitHub token.');
    const randName = crypto.randomUUID() + '.jpg';
    const path = `images/uploads/${randName}`;
    const dataUrl = await resizeAndCompress(file);
    const base64Content = dataUrl.split(',')[1];
    const apiUrl = `https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`;
    const body = { message: 'Nahrání fotky ' + randName, content: base64Content, branch: BRANCH };
    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      throw new Error(`${err.message || 'Nahrání selhalo'} (repo: ${REPO}, cesta: ${path}, status: ${putRes.status})`);
    }
    return `/${path}`;
  }

  $('save-btn').addEventListener('click', saveContent);
  $('update-pw-btn').addEventListener('click', savePasswords);

  $('add-photo-btn').addEventListener('click', () => $('photo-upload').click());
  $('photo-upload').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    const status = $('save-status');
    status.textContent = 'Nahrávám fotky…';
    status.style.color = 'var(--ink-soft)';
    try {
      const card = getActiveCard();
      for (const file of files) {
        const imageUrl = await uploadPhoto(file);
        card.photos.push({ url: imageUrl, caption: '' });
      }
      status.textContent = 'Fotky nahrány - nezapomeňte Uložit změny ✓';
      renderPhotos();
    } catch (err) {
      status.textContent = 'Chyba: ' + err.message;
      status.style.color = 'var(--danger)';
    }
    e.target.value = '';
    setTimeout(() => { status.textContent = ''; }, 5000);
  });

  $('save-token-btn').addEventListener('click', () => {
    const token = $('github-token').value.trim();
    if (token) { saveToken(token); $('github-token').value = ''; }
  });

  async function enterMain() {
    await contentPromise;
    if (!state.activeCardId && state.content.cards.length > 0) {
      state.activeCardId = state.content.cards[0].id;
    }
    renderContent();

    $('lock-screen').classList.add('hidden');
    $('main-wrap').classList.remove('hidden');
    document.body.classList.remove('locked');

    if (state.role === 'admin') {
      $('role-badge').classList.remove('hidden');
      $('site-title').removeAttribute('readonly');
      $('site-text').classList.add('hidden');
      $('edit-text').classList.remove('hidden');
      $('admin-controls').classList.remove('hidden');
      renderThemeSwatches();
      renderFontSwatches();
      renderCardTabs();
    } else {
      $('role-badge').classList.add('hidden');
      $('site-title').setAttribute('readonly', 'true');
      $('site-text').classList.remove('hidden');
      $('edit-text').classList.add('hidden');
      $('admin-controls').classList.add('hidden');
      renderCardTabs();
    }
  }

  $('unlock-btn').addEventListener('click', async () => {
    const pass = $('password-input').value;
    if (!pass) return;
    $('unlock-btn').disabled = true;
    await passwordsPromise;
    const hash = await sha256(pass);
    $('unlock-btn').disabled = false;

    if (hash === state.passwords.adminHash) {
      state.role = 'admin';
      enterMain();
    } else if (hash === state.passwords.viewHash) {
      state.role = 'viewer';
      enterMain();
    } else {
      const el = $('error-msg');
      el.textContent = 'Špatné heslo, zkuste to znovu.';
      el.classList.remove('hidden');
    }
  });

  $('password-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('unlock-btn').click();
  });

  $('logout-btn').addEventListener('click', () => {
    state.role = null;
    state.activeCardId = null;
    $('main-wrap').classList.add('hidden');
    $('lock-screen').classList.remove('hidden');
    $('password-input').value = '';
    $('password-input').focus();
    $('error-msg').classList.add('hidden');
    document.body.classList.add('locked');
  });

  function init() {
    $('loading').classList.add('hidden');
    $('lock-screen').classList.remove('hidden');
    $('password-input').focus();

    contentPromise = loadContent().then(() => {
      applyTheme(state.content.theme);
      applyFont(state.content.font);
    });
    passwordsPromise = loadPasswords();

    state.githubToken = getToken();
    if (state.githubToken) $('token-status').textContent = 'Token načten.';
  }

  init();
})();
</script>
</body>
